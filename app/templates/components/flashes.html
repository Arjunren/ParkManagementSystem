{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="mb-6 space-y-2" aria-live="polite">
  {% for category, message in messages %}
  <div class="toast {{ 'toast-error' if category == 'error' else 'toast-success' }}" role="alert">
    <span>{{ message }}</span><button class="toast-close" type="button" aria-label="Dismiss">×</button>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
