{% extends 'base.html' %}{% block title %}Change password{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">Account</p><h1>Change password</h1></div></div><section class="card max-w-xl"><form class="space-y-4" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field-label">Current password<input class="field" type="password" name="current_password" required autocomplete="current-password"></label><label class="field-label">New password<input class="field" type="password" name="password" minlength="10" required autocomplete="new-password"><span class="field-help">You will be signed out of all active sessions.</span></label><button class="btn-primary" type="submit">Update password</button></form></section>{% endblock %}
