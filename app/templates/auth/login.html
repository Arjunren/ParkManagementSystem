{% extends 'base.html' %}{% block title %}Sign in{% endblock %}
{% block auth_content %}
<section class="auth-card">
  <h1 class="text-2xl font-bold">Welcome back</h1><p class="mt-1 text-sm text-slate-500">Sign in to the operations dashboard.</p>
  <form class="mt-6 space-y-4" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field-label">Username or email<input class="field" name="identity" autocomplete="username" required autofocus></label>
    <label class="field-label">Password<input class="field" type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn-primary w-full" type="submit">Sign in</button>
  </form>
  <div class="mt-5 flex justify-between text-sm"><a class="text-link" href="{{ url_for('auth.forgot_password') }}">Forgot password?</a><a class="text-link" href="{{ url_for('auth.register') }}">Create account</a></div>
</section>
{% endblock %}
