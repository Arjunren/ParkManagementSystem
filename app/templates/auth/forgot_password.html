{% extends 'base.html' %}{% block title %}Forgot password{% endblock %}
{% block auth_content %}<section class="auth-card"><h1 class="text-2xl font-bold">Reset your password</h1><p class="mt-1 text-sm text-slate-500">Enter your username or email. We will respond the same way whether or not the account exists.</p>
<form class="mt-6 space-y-4" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field-label">Username or email<input class="field" name="identity" required></label><button class="btn-primary w-full" type="submit">Send reset instructions</button></form><p class="mt-5 text-center text-sm"><a class="text-link" href="{{ url_for('auth.login') }}">Back to sign in</a></p></section>{% endblock %}
