{% extends 'base.html' %}{% block title %}Reset password{% endblock %}
{% block auth_content %}<section class="auth-card"><h1 class="text-2xl font-bold">Choose a new password</h1><form class="mt-6 space-y-4" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field-label">New password<input class="field" type="password" name="password" minlength="10" required autocomplete="new-password"><span class="field-help">10+ characters with uppercase, lowercase, number, and symbol.</span></label><button class="btn-primary w-full" type="submit">Reset password</button></form></section>{% endblock %}
